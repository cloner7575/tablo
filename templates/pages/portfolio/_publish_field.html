<div class="field pf-switch{% if field.errors %} field--invalid{% endif %}">
  <label for="{{ field.id_for_label }}">
    {{ field }}
    <span class="pf-switch__track" aria-hidden="true"></span>
    <span class="pf-switch__label">{{ field.label }}</span>
  </label>
  {% if field.help_text %}
    <div class="field__help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>
  {% endif %}
  {% if field.errors %}
    <div class="field__error" id="{{ field.auto_id }}_error">
      {% for error in field.errors %}<p>{{ error }}</p>{% endfor %}
    </div>
  {% endif %}
</div>
