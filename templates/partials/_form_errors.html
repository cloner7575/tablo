{% load i18n %}
{% if form.non_field_errors %}
  <div class="form-errors" role="alert" tabindex="-1">
    {% include "components/_icon.html" with name="alert-circle" %}
    <div>
      <p class="form-errors__title">{% translate "There is a problem with this form." %}</p>
      <ul>
        {% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}
      </ul>
    </div>
  </div>
{% endif %}
