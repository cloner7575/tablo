{% load static %}
<article class="at-maker ir-provider"><div class="at-maker__image">{% if provider.image %}<img src="{% static 'img/references/' %}{{ provider.image }}" alt="{{ provider.name }}" width="600" height="400" loading="lazy">{% else %}<span class="ir-provider__placeholder">{% include 'components/_icon.html' with name='layers' size='lg' %}<strong>{{ provider.name }}</strong></span>{% endif %}</div><div class="at-maker__body">{% if provider.city_name %}<p class="ed-kicker">{{ provider.city_name }}</p>{% endif %}<h3>{{ provider.name }}</h3><p>{{ provider.description }}</p></div></article>
