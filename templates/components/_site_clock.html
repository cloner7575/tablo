<button type="button" class="site-clock" data-clock-open aria-label="تنظیم ساعت سایت" aria-haspopup="dialog" aria-controls="site-clock-dialog" aria-expanded="false" hidden>
  <span class="clock-mini" aria-hidden="true"><span class="clock-mini__hour"></span><span class="clock-mini__minute"></span><span class="clock-mini__pin"></span></span>
  <span data-clock-label>ساعت سایت</span>
</button>

        <linearGradient id="clock-metal" x2=".7" y2="1"><stop stop-color="var(--clock-brass-light)"/><stop offset=".45" stop-color="var(--clock-brass)"/><stop offset="1" stop-color="var(--clock-brass-dark)"/></linearGradient>

      <text x="160" y="113" class="dial-brand" aria-hidden="true">{{ SITE_NAME }}</text>
      <text x="160" y="217" class="dial-signature" aria-hidden="true">از سپیده تا شب</text>
      <g class="clock-hand clock-hand--hour" data-clock-hand="hour" tabindex="0" role="slider" aria-label="عقربه ساعت‌شمار" aria-valuemin="0" aria-valuemax="23" aria-valuenow="12" aria-valuetext="۱۲:۰۰" focusable="true">
        <line x1="160" y1="169" x2="160" y2="85" class="clock-hand__hit"/>

      </g>
      <g class="clock-hand clock-hand--minute" data-clock-hand="minute" tabindex="0" role="slider" aria-label="عقربه دقیقه‌شمار" aria-valuemin="0" aria-valuemax="59" aria-valuenow="0" aria-valuetext="۱۲:۰۰" focusable="true">

  <div class="clock-readout"><time data-clock-time dir="ltr">۱۲:۰۰</time><button type="button" class="clock-halfday" data-clock-halfday aria-label="تغییر قبل یا بعد از ظهر">بعد از ظهر</button></div>
  <p class="clock-status" data-clock-status></p>
  <div class="clock-nudges" role="group" aria-label="تنظیم زمان بدون کشیدن عقربه">
    <button type="button" data-clock-step="-15" aria-label="۱۵ دقیقه زودتر">۱۵ دقیقه زودتر</button>
    <button type="button" data-clock-step="15" aria-label="۱۵ دقیقه دیرتر">۱۵ دقیقه دیرتر</button>
  </div>
  <details class="clock-precise"><summary>تنظیم دقیق ساعت</summary><form data-clock-form><label for="site-clock-time">ساعت دلخواه</label><input type="time" id="site-clock-time" dir="ltr" data-clock-input required step="60"><button type="submit" class="visually-hidden">تنظیم ساعت</button></form></details>
  <button type="button" class="btn btn--secondary btn--block" data-clock-real>زمان واقعی دستگاه</button>
  <p class="clock-help">انتخاب تو تا بستن این تب حفظ می‌شود.</p>
  <span class="visually-hidden" data-clock-announcement role="status" aria-live="polite"></span>
</dialog>
